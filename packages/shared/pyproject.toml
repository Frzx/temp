[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.24",
    "pydantic-settings>=2.14.1",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
]


[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['shared']